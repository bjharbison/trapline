name: V2 API scaffold tests

on:
  pull_request:
    branches: [develop/v2-roadmap]
    paths:
      - "backend/**"
      - ".github/workflows/v2-api-tests.yml"
  push:
    branches: [develop/v2-roadmap]
    paths:
      - "backend/**"
      - ".github/workflows/v2-api-tests.yml"

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: python -m pip install -e './backend[test]'
      - name: Run API contract and loopback/CORS tests
        working-directory: backend
        run: python -m pytest -q
