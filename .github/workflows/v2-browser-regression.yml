name: V2 browser regression

on:
  pull_request:
    branches:
      - develop/v2-roadmap
  push:
    branches:
      - develop/v2-roadmap

permissions:
  contents: read

concurrency:
  group: trapline-v2-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    name: V1 compatibility and offline privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install browser test runner
        run: python -m pip install --disable-pip-version-check playwright==1.56.0

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run all V1 browser regression tests
        run: bash tests/run_all.sh
