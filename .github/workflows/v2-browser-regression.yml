name: V2 browser regression

on:
  pull_request:
    branches:
      - develop/v2-roadmap
  push:
    branches:
      - develop/v2-roadmap

permissions:
  contents: read

concurrency:
  group: trapline-v2-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    name: V1 compatibility and offline privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test runner
        run: python -m pip install --disable-pip-version-check playwright==1.56.0

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run all V1 browser regression tests
        run: bash tests/run_all.sh
